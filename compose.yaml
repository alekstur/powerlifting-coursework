name: bigdata-kursach

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-powerlifting}
      POSTGRES_USER: ${POSTGRES_USER:-coursework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with a local password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    profiles: ["tools"]
    build:
      context: .
      target: app
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-powerlifting}
      PGUSER: ${POSTGRES_USER:-coursework}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Create .env with a local password}
      SUPERSET_META_PASSWORD: ${SUPERSET_META_PASSWORD:-}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./openpowerlifting-2026-10-03:/data/source:ro
      - ./reports:/app/reports

  superset:
    build:
      context: .
      target: superset
    environment:
      SUPERSET_CONFIG_PATH: /app/coursework/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Set Superset secrets in .env}
      SUPERSET_META_PASSWORD: ${SUPERSET_META_PASSWORD:?Set Superset secrets in .env}
      SUPERSET_READER_PASSWORD: ${SUPERSET_READER_PASSWORD:?Set Superset secrets in .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Set Superset secrets in .env}
      SUPERSET_LOAD_EXAMPLES: "no"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./superset:/app/coursework:ro
      - superset_home:/app/superset_home
    command: ["gunicorn", "--bind", "0.0.0.0:8088", "--workers", "2", "--threads", "4", "--timeout", "180", "superset.app:create_app()"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  postgres_data:
  superset_home:
